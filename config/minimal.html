<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trio Pebble Settings</title>
<style>
  body { font-family: sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 16px; }
  h1 { color: #00e676; }
  .card { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  label { display: block; margin-bottom: 6px; color: #ccc; }
  select { width: 100%; padding: 10px; background: #111; color: #fff; border: 1px solid #333; border-radius: 8px; }
  .btn { width: 100%; padding: 14px; background: #00c853; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; margin-top: 20px; }
</style>
</head>
<body>
<h1>Trio Pebble</h1>
<div class="card">
  <label>Data Source</label>
  <select id="dataSource">
    <option value="0">Trio (Local)</option>
    <option value="2">Nightscout</option>
    <option value="1">Dexcom Share</option>
  </select>
</div>
<div class="card">
  <label>Graph Time Range</label>
  <select id="graphTimeRange">
    <option value="0">3 Hours</option>
    <option value="1">6 Hours</option>
    <option value="2">12 Hours</option>
    <option value="3">24 Hours</option>
  </select>
</div>
<button class="btn" onclick="save()">Save Settings</button>
<script>
function getSettings() {
  return {
    dataSource: parseInt(document.getElementById("dataSource").value),
    graphTimeRange: parseInt(document.getElementById("graphTimeRange").value),
    // All other values are hardcoded
    faceType: 0,
    colorScheme: 1,
    headerSize: 2,
    compSlot3: 4
  };
}
function save() {
  var settings = getSettings();
  document.location = "pebblejs://close#" + encodeURIComponent(JSON.stringify(settings));
}
function loadSettings(settings) {
  if (settings.dataSource !== undefined) document.getElementById("dataSource").value = settings.dataSource;
  if (settings.graphTimeRange !== undefined) document.getElementById("graphTimeRange").value = settings.graphTimeRange;
}
var hash = window.location.hash.substring(1);
if (hash) {
  try {
    var settings = JSON.parse(decodeURIComponent(hash));
    loadSettings(settings);
  } catch(e) {}
}
</script>
</body>
</html>
