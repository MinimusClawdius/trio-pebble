<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;padding:20px}select{width:100%;padding:10px;margin:10px 0}</style>
</head>
<body>
<h2>Trio Pebble</h2>
<label>Data Source</label>
<select id="dataSource">
<option value="0">Trio</option>
<option value="2">Nightscout</option>
<option value="1">Dexcom</option>
</select>
<label>Graph Time</label>
<select id="graphTimeRange">
<option value="0">3H</option>
<option value="1">6H</option>
<option value="2">12H</option>
<option value="3">24H</option>
</select>
<button onclick="save()" style="width:100%;padding:12px;margin-top:20px">Save</button>
<script>
function save(){var s={dataSource:parseInt(document.getElementById("dataSource").value),graphTimeRange:parseInt(document.getElementById("graphTimeRange").value)};location="pebblejs://close#"+encodeURIComponent(JSON.stringify(s))}
var h=location.hash.substring(1);if(h){try{var s=JSON.parse(decodeURIComponent(h));if(s.dataSource)document.getElementById("dataSource").value=s.dataSource;if(s.graphTimeRange)document.getElementById("graphTimeRange").value=s.graphTimeRange}catch(e){}}
</script>
</body>
</html>
